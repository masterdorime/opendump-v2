<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>opendump</title>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <div class="mark">od</div>
        <div>
          <h1>opendump</h1>
          <p id="subtitle">Rust core · nothing scanned yet</p>
        </div>
      </div>
      <div class="actions">
        <button id="scan" class="btn primary">Scan C:\</button>
      </div>
    </header>

    <div id="progress" class="progress hidden"><i></i><span id="progress-text"></span></div>

    <main>
      <section class="summary" id="summary"></section>
      <section class="list-head">
        <h2>Review</h2>
        <div class="list-actions">
          <button id="select-safe" class="btn tiny">Select all safe</button>
          <span id="selection" class="muted">0 selected</span>
          <button id="quarantine" class="btn tiny primary" disabled>Quarantine</button>
        </div>
      </section>
      <section id="list" class="list"></section>

      <section class="staged">
        <div class="list-head">
          <h2>Quarantine</h2>
          <div class="list-actions">
            <span id="staged-total" class="muted">empty</span>
            <button id="restore" class="btn tiny" disabled>Restore all</button>
            <button id="purge" class="btn tiny danger" disabled>Purge all</button>
          </div>
        </div>
        <div id="staged-list" class="list"></div>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
