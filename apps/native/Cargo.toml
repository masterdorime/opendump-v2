[workspace]

[package]
name = "opendump-native"
version = "0.1.0"
description = "opendump native UI — egui, no webview"
edition = "2021"
license = "MIT"

[[bin]]
name = "opendump-native"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
opendump-core = { path = "../../crates/opendump-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
